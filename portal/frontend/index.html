<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="theme-color" content="#ffffff"/>
    <!-- The JSAN mark on a brand-blue tile. Generated from one description of
         the geometry by scripts/icons.mjs - run `npm run icons` after changing
         it, so the vector and the raster versions stay in agreement.
         SVG first for browsers that take one; the PNG is the fallback Safari
         and older engines use. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <title>JSAN Dev AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
