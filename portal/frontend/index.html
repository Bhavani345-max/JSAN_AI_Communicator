<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <!-- interactive-widget: when the on-screen keyboard opens, shrink the page
         rather than leave it full height behind the keyboard. That is what
         keeps the composer directly above the keys on Android instead of
         somewhere underneath them. Ignored by browsers that do not know it,
         and no scale is pinned, so pinch zoom still works. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"/>
    <meta name="theme-color" content="#ffffff"/>
    <!-- The JSAN mark on a brand-blue tile. All three are generated from one
         description of the geometry by scripts/icons.mjs - run `npm run icons`
         after changing it, so they cannot drift apart.

         favicon.ico is listed first and holds 16, 32 and 48 pixel versions.
         It has to exist whether or not it is linked: every browser asks for
         /favicon.ico by name, as does anything unfurling a link to the portal.
         `sizes="any"` is what lets a modern browser skip it and take the
         sharper SVG instead. -->
    <link rel="icon" href="/favicon.ico" sizes="any"/>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <title>JSAN Dev AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
